name: Build KidsTube APK

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: install
        run: |
          bun link
          bun install --frozen-lockfile

      - name: typecheck
        run: bunx tsc --noEmit

      - name: unit tests
        run: bun test

      - name: bundle the page script
        run: bun bundle:es

  android-test:
    name: Android unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2

      - name: install and prebuild
        run: |
          bun link
          bun install --frozen-lockfile
          bun expo prebuild -p android --clean --no-install

      - name: test Android module
        run: ./gradlew :nou-tube-view:testFullDebugUnitTest :nou-tube-view:testFossDebugUnitTest
        working-directory: android

  build:
    name: Build APK
    needs: [test, android-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: oven-sh/setup-bun@v2

      - name: install, bundle and prebuild
        run: |
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p android --clean --no-install

      - name: build apk
        run: ./gradlew assembleFullRelease
        working-directory: android

      # https://github.com/r0adkll/sign-android-release/issues/84#issuecomment-1889636075
      - name: set build tool version
        shell: bash
        run: |
          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
          echo build tool version: $BUILD_TOOL_VERSION
          echo "VERSION_CODE=$(jq -r '.versionCode' package.json)" >> $GITHUB_ENV

      - uses: r0adkll/sign-android-release@v1
        name: sign apk
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: rename apk
        run: |
          sudo apt-get update && sudo apt-get install -y rename
          rename 's/release-unsigned-signed/release/' *.apk
        working-directory: android/app/build/outputs/apk/full/release

      - name: upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidstube-apk
          path: android/app/build/outputs/apk/full/release/*-release.apk
          if-no-files-found: error

      - name: upload apk release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/full/release/*-release.apk
